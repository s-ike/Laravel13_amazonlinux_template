services:
  web:
    build:
      context: ./docker/php
      args:
        PHP_VERSION: ${PHP_VERSION:-8.5.12}
    ports:
      - target: 80
        host_ip: ${WEB_HOST_IP:-127.0.0.1}
        published: ${WEB_PORT:-80}
        protocol: tcp
        mode: host
    volumes:
      - type: bind
        source: ${APP_PATH}
        target: /usr/local/src/${APP_NAME}/src
      - type: bind
        source: ${DOCKER_PATH}/php/default.conf
        target: /etc/nginx/conf.d/default.conf
      - type: bind
        source: ${DOCKER_PATH}/php/php.ini
        target: /usr/local/etc/php/conf.d/php.ini
      - type: bind
        source: ${DOCKER_PATH}/php/php-fpm.conf
        target: /usr/local/etc/php-fpm.conf
    working_dir: /usr/local/src/${APP_NAME}/src
    environment:
      - WEB_PORT=${WEB_PORT:-80}

  db:
    image: mysql:8.4
    ports:
      - target: 3306
        host_ip: 127.0.0.1
        published: ${FORWARD_DB_PORT:-3306}
        protocol: tcp
        mode: host
    volumes:
      - type: bind
        source: ${DATA_PATH}/db
        target: /var/lib/mysql
      - type: bind
        source: ${DATA_PATH}/log/mysql
        target: /var/log/mysql
      - type: bind
        source: ${DOCKER_PATH}/mysql/my.cnf
        target: /etc/mysql/conf.d/my.cnf
    environment:
      - MYSQL_DATABASE=${DB_DATABASE}
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - TZ=${APP_TIMEZONE:-Asia/Tokyo}
